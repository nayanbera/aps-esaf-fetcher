{% if sync_settings_msg %}
<div class="alert alert-success alert-sm py-1 px-2 mb-2 small">{{ sync_settings_msg }}</div>
{% endif %}

<form hx-post="/admin/sync-settings"
      hx-target="#sync-settings-wrap"
      hx-swap="innerHTML">
  <div class="mb-2">
    <label class="form-label form-label-sm fw-semibold mb-1">
      Auto-sync interval (hours)
    </label>
    <div class="input-group input-group-sm">
      <input type="number" name="sync_interval_hours" class="form-control form-control-sm"
             min="0" max="168" step="1"
             value="{{ sync_interval_hours }}"
             placeholder="0 = disabled">
      <button class="btn btn-primary btn-sm" type="submit">
        <i class="bi bi-check2 me-1"></i>Apply
      </button>
    </div>
    <div class="form-text">
      {% if sync_interval_hours > 0 %}
        Auto-sync runs every <strong>{{ sync_interval_hours }}h</strong>. Set to 0 to disable.
      {% else %}
        Auto-sync is <strong>disabled</strong>. Enter a value &gt; 0 to enable.
      {% endif %}
    </div>
  </div>
</form>
