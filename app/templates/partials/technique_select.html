<select name="technique"
        class="form-select form-select-sm technique-select{% if technique == 'Surf' %} technique-Surf{% elif technique == 'Xtal' %} technique-Xtal{% elif technique == 'ASWAXS' %} technique-ASWAXS{% elif technique == 'Beamline' %} technique-Beamline{% endif %}"
        hx-post="{{ post_url }}"
        hx-trigger="change"
        hx-target="closest td"
        hx-swap="innerHTML"
        data-technique="{{ technique }}">
  <option value=""{% if not technique %} selected{% endif %}>—</option>
  <option value="Surf"{% if technique == 'Surf' %} selected{% endif %}>Surf</option>
  <option value="Xtal"{% if technique == 'Xtal' %} selected{% endif %}>Xtal</option>
  <option value="ASWAXS"{% if technique == 'ASWAXS' %} selected{% endif %}>ASWAXS</option>
  <option value="Beamline"{% if technique == 'Beamline' %} selected{% endif %}>Beamline</option>
</select>
