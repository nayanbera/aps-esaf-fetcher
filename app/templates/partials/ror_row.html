{% set ror_types = row.manual_types %}
<tr>
  <td class="small">{{ row.name }}</td>
  <td>
    {% for t in ror_types %}
    <span class="badge bg-{{ type_badge_class(t) }} me-1">{{ t }}</span>
    {% endfor %}
    {% if row.manual_types %}
    <span class="badge bg-light text-dark border ms-1" title="Imported / manually set">✎</span>
    {% endif %}
    {% if not ror_types %}
    <span class="text-muted small">—</span>
    {% endif %}
  </td>
  <td class="small">{{ row.country or '—' }}</td>
  <td class="small">{{ row.inst_state or '—' }}</td>
  <td class="text-end small">{{ row.user_count or 0 }}</td>
  <td class="text-end small">{{ row.esaf_count or 0 }}</td>
  <td>
    <div class="d-flex gap-1">
      <button class="btn btn-outline-primary btn-sm py-0"
              hx-get="/institutions/edit-form?name={{ url_quote(row.name) }}"
              hx-target="closest tr"
              hx-swap="outerHTML"
              title="Edit name / set type">
        <i class="bi bi-pencil"></i>
      </button>
      <form hx-post="/institutions/lookup-one"
            hx-target="closest tr"
            hx-swap="outerHTML">
        <input type="hidden" name="name" value="{{ row.name }}">
        <button type="submit" class="btn btn-outline-secondary btn-sm py-0"
                title="Re-lookup via ROR">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </form>
    </div>
  </td>
</tr>
