{% if cp_error %}
<div class="alert alert-danger py-1 px-2 small mb-2">{{ cp_error }}</div>
{% endif %}
{% if cp_msg %}
<div class="alert alert-success py-1 px-2 small mb-2">{{ cp_msg }}</div>
{% endif %}
<div class="mb-2">
  <input type="password" id="cp-current" name="current_password"
         class="form-control form-control-sm" placeholder="Current password"
         autocomplete="current-password">
</div>
<div class="mb-2">
  <input type="password" id="cp-new" name="new_password"
         class="form-control form-control-sm" placeholder="New password (min 8 chars)"
         autocomplete="new-password">
</div>
<div class="mb-2">
  <input type="password" id="cp-confirm" name="confirm_password"
         class="form-control form-control-sm" placeholder="Confirm new password"
         autocomplete="new-password">
</div>
<button class="btn btn-sm btn-warning w-100"
        hx-post="/admin/change-password"
        hx-target="#change-pw-wrap"
        hx-swap="innerHTML"
        hx-include="#cp-current, #cp-new, #cp-confirm">
  <i class="bi bi-shield-lock me-1"></i>Update Password
</button>
