<tr id="override-row-{{ o.domain }}">
  <td><code>{{ o.domain }}</code></td>
  <form hx-post="/overrides/{{ o.domain }}"
        hx-target="#override-row-{{ o.domain }}"
        hx-swap="outerHTML"
        style="display:contents">
    <td>
      <input type="text" name="institution" value="{{ o.institution }}"
             class="form-control form-control-sm" placeholder="Institution name">
    </td>
    <td>
      <input type="text" name="country" value="{{ o.country }}"
             class="form-control form-control-sm" maxlength="2" placeholder="US">
    </td>
    <td>
      <input type="text" name="state" value="{{ o.state }}"
             class="form-control form-control-sm" placeholder="IL">
    </td>
    <td class="text-muted small">{{ (o.created_at or '')[:10] }}</td>
    <td class="text-end">
      <button type="submit" class="btn btn-success btn-sm py-0 me-1">
        <i class="bi bi-check-lg"></i>
      </button>
      <button type="button" class="btn btn-outline-secondary btn-sm py-0"
              hx-get="/overrides/{{ o.domain }}/view"
              hx-target="#override-row-{{ o.domain }}"
              hx-swap="outerHTML">
        <i class="bi bi-x-lg"></i>
      </button>
    </td>
  </form>
</tr>
