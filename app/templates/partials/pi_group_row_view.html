<tr id="pg-row-{{ pg.name | urlencode }}">
  <td class="fw-semibold">{{ pg.name }}</td>
  <td>{{ pg.pi_name or '—' }}</td>
  <td>{{ pg.institution or '—' }}</td>
  <td>{{ pg.country or '—' }}</td>
  <td>{{ pg.state or '—' }}</td>
  <td>
    {% if pg.orcid_id %}
      <a href="https://orcid.org/{{ pg.orcid_id }}" target="_blank" rel="noopener"
         class="small font-monospace text-nowrap">
        <img src="https://orcid.org/sites/default/files/images/orcid_16x16.png"
             width="13" height="13" alt="ORCID" class="me-1">{{ pg.orcid_id }}
      </a>
    {% else %}
      —
    {% endif %}
  </td>
  <td class="text-end text-nowrap">
    <button class="btn btn-outline-secondary btn-sm py-0 me-1"
            hx-get="/pi-groups/{{ pg.name | urlencode }}/edit"
            hx-target="#pg-row-{{ pg.name | urlencode }}"
            hx-swap="outerHTML">
      <i class="bi bi-pencil"></i>
    </button>
    <button class="btn btn-outline-danger btn-sm py-0"
            hx-delete="/pi-groups/{{ pg.name | urlencode }}"
            hx-target="#pg-row-{{ pg.name | urlencode }}"
            hx-swap="outerHTML"
            hx-confirm="Delete PI Group '{{ pg.name }}'?">
      <i class="bi bi-trash"></i>
    </button>
  </td>
</tr>
