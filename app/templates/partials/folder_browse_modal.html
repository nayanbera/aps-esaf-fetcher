<!-- Server folder browser. Include once per page; a trigger button needs:
       hx-get="/folders/browse" hx-include="#<input id>" hx-target="#folder-browse-body"
       data-bs-toggle="modal" data-bs-target="#folder-browse-modal" data-folder-input="<input id>" -->
<div class="modal fade" id="folder-browse-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title"><i class="bi bi-hdd-network me-2"></i>Select a folder on the server</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="folder-browse-body">
        <div class="text-muted small">Loading…</div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var targetInput = null;
  document.addEventListener('click', function (e) {
    var opener = e.target.closest('[data-folder-input]');
    if (opener) targetInput = document.getElementById(opener.dataset.folderInput);
    var btn = e.target.closest('[data-select-path]');
    if (!btn || !targetInput) return;
    targetInput.value = btn.dataset.selectPath;
    bootstrap.Modal.getInstance(document.getElementById('folder-browse-modal')).hide();
  });
  document.body.addEventListener('htmx:responseError', function (e) {
    var body = document.getElementById('folder-browse-body');
    if (body && e.detail.target === body) {
      body.innerHTML = '<div class="alert alert-danger small mb-0">Could not list folders (HTTP ' +
                       e.detail.xhr.status + ').</div>';
    }
  });
})();
</script>
