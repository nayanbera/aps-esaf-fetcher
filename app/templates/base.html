<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}APS ESAF Fetcher{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/geo-data.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-journal-bookmark-fill me-1"></i>APS ESAF Fetcher
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.url.path.startswith('/esafs') %}active{% endif %}"
             href="/esafs"><i class="bi bi-list-ul me-1"></i>ESAFs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/sync' %}active{% endif %}"
             href="/sync"><i class="bi bi-arrow-repeat me-1"></i>Sync</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.url.path.startswith('/gups') %}active{% endif %}"
             href="/gups"><i class="bi bi-file-earmark-text me-1"></i>GUPs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/pi-groups' %}active{% endif %}"
             href="/pi-groups"><i class="bi bi-person-badge me-1"></i>PI Groups</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/overrides' %}active{% endif %}"
             href="/overrides"><i class="bi bi-patch-check me-1"></i>Affiliations</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/fields' %}active{% endif %}"
             href="/fields"><i class="bi bi-sliders me-1"></i>Custom Fields</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/institutions' %}active{% endif %}"
             href="/institutions"><i class="bi bi-building me-1"></i>Institutions</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/stats' %}active{% endif %}"
             href="/stats"><i class="bi bi-bar-chart-fill me-1"></i>Statistics</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid py-3 px-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Shared geo datalists — populated by geo-data.js + /api/institutions -->
<datalist id="geo-countries-list"></datalist>
<datalist id="geo-states-list"></datalist>
<datalist id="geo-institutions-list"></datalist>

<script>
(function () {
  function addOpts(listId, pairs) {
    var dl = document.getElementById(listId);
    if (!dl) return;
    pairs.forEach(function (p) {
      var o = document.createElement('option');
      o.value = p[0];
      o.textContent = p[1];
      dl.appendChild(o);
    });
  }
  if (typeof GEO_COUNTRIES !== 'undefined') addOpts('geo-countries-list', GEO_COUNTRIES);
  if (typeof US_STATES    !== 'undefined') addOpts('geo-states-list',    US_STATES);

  fetch('/api/institutions').then(function (r) { return r.json(); }).then(function (names) {
    var dl = document.getElementById('geo-institutions-list');
    if (!dl) return;
    names.forEach(function (n) {
      var o = document.createElement('option');
      o.value = n;
      dl.appendChild(o);
    });
  }).catch(function () {});

  // Show US-state suggestions only when country input value is "US".
  document.addEventListener('input', function (e) {
    var input = e.target;
    if (!input.hasAttribute('data-country-input')) return;
    var container = input.closest('tr, form, .modal-body');
    if (!container) return;
    var stateInput = container.querySelector('[data-state-input]');
    if (!stateInput) return;
    if (input.value.trim().toUpperCase() === 'US') {
      stateInput.setAttribute('list', 'geo-states-list');
    } else {
      stateInput.removeAttribute('list');
    }
  });

  // On page load, set state datalist for any country inputs already set to "US".
  document.querySelectorAll('[data-country-input]').forEach(function (input) {
    if (input.value.trim().toUpperCase() === 'US') {
      var container = input.closest('tr, form, .modal-body');
      var stateInput = container && container.querySelector('[data-state-input]');
      if (stateInput) stateInput.setAttribute('list', 'geo-states-list');
    }
  });
})();
</script>
</body>
</html>
